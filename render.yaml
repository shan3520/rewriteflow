services:
  - type: web
    name: rewriteai-backend
    runtime: node
    plan: free
    # Built from the repo root because the backend reads shared/steps.json
    # and presets/*.yaml.
    buildCommand: cd backend && npm ci
    startCommand: node backend/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: DAILY_CHAR_LIMIT
        value: "0"
    healthCheckPath: /api/health
    autoDeploy: true
